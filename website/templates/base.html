<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}SafeDrive AI{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <!-- Navbar -->
  <nav>
    <div class="logo">SafeDrive AI <span>Beta</span></div>
    <ul>
      <li><a href="{{ url_for('routes.home') }}">Home</a></li>
      <li><a href="{{ url_for('routes.home') }}#how-it-works">How It Works</a></li>
      <li><a href="{{ url_for('routes.home') }}#about">About</a></li>
    </ul>
    <div class="auth">
      {% if current_user.is_authenticated %}
        <a class="signin" href="{{ url_for('routes.dashboard') }}">My dashboard</a>
        <form method="POST" action="{{ url_for('routes.logout') }}" style="display:inline;">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button class="getstarted" type="submit">Sign out</button>
        </form>
      {% else %}
        <a class="signin" href="{{ url_for('routes.login') }}">Sign In</a>
        <a class="getstarted" href="{{ url_for('routes.register') }}">Get Started</a>
      {% endif %}
    </div>
  </nav>

  <!-- Main Content -->
  {% block content %}{% endblock %}
</body>
</html>
