<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ code }} · SafeDrive AI</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', system-ui, sans-serif; }
body { min-height:100vh; display:flex; align-items:center; justify-content:center; background:#f3f4f6; color:#1f2937; padding:16px; }
.box { background:#fff; border-radius:16px; box-shadow:0 4px 15px rgba(0,0,0,0.06); padding:32px; max-width:440px; width:100%; text-align:center; }
.code { font-size:44px; font-weight:700; color:#4f46e5; }
p { margin:12px 0 24px; color:#6b7280; line-height:1.5; }
a { display:inline-block; padding:10px 18px; border-radius:8px; background:#4f46e5; color:#fff; text-decoration:none; font-weight:600; }
</style>
</head>
<body>
<div class="box" role="alert">
    <div class="code">{{ code }}</div>
    <p>{{ message }}</p>
    <a href="{{ url_for('routes.dashboard') if current_user.is_authenticated else url_for('routes.home') }}">
        {{ 'Back to my dashboard' if current_user.is_authenticated else 'Back to home' }}</a>
</div>
</body>
</html>
